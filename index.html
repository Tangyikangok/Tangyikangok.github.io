    { rank: 6, name: '李聪聪', team: '海宁队', pts: 80 },
    { rank: 7, name: '周煜航', team: '江山队', pts: 80 },
    { rank: 8, name: '徐梓凯', team: '台州队', pts: 80 },
    { rank: 9, name: '朱浩元', team: '温州队', pts: 80 },
    { rank: 10, name: '虞航', team: '余姚队', pts: 77 }
  ],
  results: [
    { date: '10-25', home: '衢州队', away: '玉环队', hs: 78, as: 68, group: 'C组' },
    { date: '10-25', home: '绍兴队', away: '临安队', hs: 75, as: 63, group: 'B组' },
    { date: '10-24', home: '永康队', away: '临海队', hs: 88, as: 71, group: 'B组' }
  ],
  schedule: [
    { no: 92, round: '第8轮', date: '10-30', time: '19:30', home: '金华队', away: '海宁队', group: 'C组', hs: null, as: null }
  ]
};

let appData = null;
let usingFallback = false;
let currentGroup = 0;
let timer = null;
let cdTimer = null;
let autoOn = true;
let nextMatch = null;

const $ = id => document.getElementById(id);

const GC = { 'A组': '#00d4ff', 'B组': '#a855f7', 'C组': '#22c55e', 'D组': '#f59e0b' };

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function parseMatch(m) {
  const [mo, d] = m.date.split('-').map(Number);
  const [h, mi] = (m.time || '19:30').split(':').map(Number);
  const now = new Date();
  let year = now.getFullYear();
  const probe = new Date(year, mo - 1, d, h, mi);
  if (probe.getTime() < now.getTime() - 6 * 30 * 864e5) year += 1;
  return new Date(year, mo - 1, d, h, mi);
}

async function load(silent) {
  const btn = $('refreshBtn');
  if (!silent) { btn.disabled = true; btn.textContent = '刷新中'; $('syncText').textContent = '数据同步中'; }

  try {
    const res = await fetch(`${CONFIG.dataPath}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    appData = await res.json();
    usingFallback = false;
  } catch (e) {
    appData = JSON.parse(JSON.stringify(FALLBACK));
    usingFallback = true;
  }

  render();
  if (!silent) { btn.disabled = false; btn.textContent = '立即刷新'; }
  $('syncText').textContent = usingFallback ? '内置示例数据' : '数据已同步';
}

function render() {
  renderMeta();
  renderKPI();
  renderTabs();
  renderGroup();
  renderResults();
  renderUpcoming();
  renderSchedule();
  renderCharts();
}

function allTeams() {
  return (appData.groups || []).flatMap(g => (g.teams || []).map(t => ({ ...t, group: g.name })));
}

function winRate(t) {
  const total = (t.w || 0) + (t.l || 0);
  return total ? (t.w / total) * 100 : 0;
}

function renderMeta() {
  const m = appData.meta || {};
  document.title = m.title || '浙BA 数据看板';
  $('hdSub').textContent = m.subtitle || '';
  $('seasonTag').textContent = m.season || '';
  $('updatedText').textContent = '最后更新：' + (m.updatedAt || '--');
  $('footerNote').textContent = (m.source ? '数据来源：' + m.source + '　' : '') + (m.note || '');
}

function countUp(el, target, dur) {
  const start = performance.now();
  function step(t) {
    const p = Math.min((t - start) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderKPI() {
  const teams = allTeams();
  const played = Math.round(teams.reduce((s, t) => s + (t.w || 0) + (t.l || 0), 0) / 2);
  const top = (appData.players || [])[0];

  $('kpiTeams').textContent = teams.length + ' 支球队';
  $('kpiRounds').textContent = played + ' 场已完赛';

  const cards = [
    { label: '参赛队伍', val: teams.length, unit: '支' },
    { label: '已完赛', val: played, unit: '场' },
    { label: '得分王', val: top ? top.pts : 0, unit: top ? '分 · ' + top.name : '' },
    { label: '小组头名', val: (appData.groups || []).length, unit: '组' }
  ];

  const box = $('kpis');
  box.innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="num" data-v="${esc(c.val)}">0<i>${esc(c.unit || '')}</i></div>
      <div class="label">${esc(c.label)}</div>
    </div>
  `).join('');

  box.querySelectorAll('.num').forEach(el => {
    const target = +el.dataset.v;
    const unit = el.querySelector('i');
    const keep = unit ? unit.outerHTML : '';
    countUp(el, target, 900);
    setTimeout(() => { if (unit) el.innerHTML = target + keep; }, 950);
  });
}

function renderTabs() {
  $('groupTabs').innerHTML = (appData.groups || []).map((g, i) =>
    `<div class="tab${i === currentGroup ? ' on' : ''}" data-i="${i}">${esc(g.name)}</div>`
  ).join('');

  $('groupTabs').querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { currentGroup = +el.dataset.i; renderTabs(); renderGroup(); };
  });
}

function renderGroup() {
  const g = (appData.groups || [])[currentGroup];
  if (!g) return;

  const color = GC[g.name] || '#00d4ff';

  $('groupBody').innerHTML = (g.teams || []).map(t => {
    const wr = winRate(t);
    const rc = t.rank <= 3 ? ' r' + t.rank : '';
    const q = t.rank <= 4;
    return `
      <tr class="${q ? 'q' : ''}">
        <td><span class="rank${rc}">${t.rank}</span></td>
        <td>${esc(t.team)}${q ? '<span class="q-tag">晋级区</span>' : ''}</td>
        <td class="wl"><b>${t.w}</b> - <i>${t.l}</i></td>
        <td class="pts num">${t.pts}</td>
        <td><div class="bar"><span data-w="${wr.toFixed(0)}" style="background:linear-gradient(90deg,${color},${color}88)"></span></div></td>
      </tr>
    `;
  }).join('');

  requestAnimationFrame(() => {
    $('groupBody').querySelectorAll('.bar span').forEach(s => { s.style.width = s.dataset.w + '%'; });
  });
}

function roundNum(r) {
  return parseInt(String(r).replace(/\D/g, ''), 10) || 0;
}

function matchRow(m, showDate) {
  const has = m.hs !== null && m.as !== null && m.hs !== undefined;
  const hw = has && m.hs > m.as;
  return `
    <div class="m-row">
      ${showDate ? `<span class="m-date">${esc(m.date)}</span>` : ''}
      <span class="m-team" style="text-align:right">${esc(m.home)}</span>
      <span class="m-sc${hw ? ' win' : ''}">${has ? m.hs + ' : ' + m.as : esc(m.time)}</span>
      <span class="m-team">${esc(m.away)}</span>
      <span class="m-tag">${esc(m.group || '')}</span>
    </div>
  `;
}

function renderResults() {
  const list = (appData.results || []).slice(0, 8);
  $('resultsBox').innerHTML = list.length
    ? list.map(m => matchRow(m, true)).join('')
    : '<p class="empty">暂无数据</p>';
}

function renderUpcoming() {
  const now = new Date();
  const list = (appData.schedule || [])
    .map(m => ({ ...m, _t: parseMatch(m) }))
    .filter(m => m._t.getTime() > now.getTime())
    .sort((a, b) => a._t - b._t)
    .slice(0, 8);

  nextMatch = list[0] || null;
  renderCountdown();

  $('upcomingBox').innerHTML = list.length
    ? list.map((m, i) => `
        <div class="m-row${i === 0 ? ' next' : ''}">
          <span class="m-date">${esc(m.date)}</span>
          <span class="m-team" style="text-align:right">${esc(m.home)}</span>
          <span class="m-sc">${esc(m.time)}</span>
          <span class="m-team">${esc(m.away)}</span>
          ${i === 0 ? '<span class="m-badge">下一场</span>' : `<span class="m-tag">${esc(m.group)}</span>`}
        </div>
      `).join('')
    : '<p class="empty">暂无待赛程</p>';
}

function renderCountdown() {
  const m = nextMatch;
  if (!m) {
    $('nxtTag').textContent = 'SEASON 2026';
    $('nxtMatch').textContent = '赛程已结束';
    $('nxtMeta').textContent = '';
    ['cdD', 'cdH', 'cdM', 'cdS'].forEach(id => $(id).textContent = '--');
    return;
  }

  $('nxtTag').textContent = `NEXT MATCH · ${esc(m.round)}`;
  $('nxtMatch').innerHTML = `${esc(m.home)}<span>VS</span>${esc(m.away)}`;
  $('nxtMeta').textContent = `${m.date} ${m.time} · ${m.group} · 第 ${m.no} 场`;

  clearInterval(cdTimer);
  function tick() {
    const diff = parseMatch(m).getTime() - Date.now();
    if (diff <= 0) {
      ['cdD', 'cdH', 'cdM', 'cdS'].forEach(id => $(id).textContent = '00');
      clearInterval(cdTimer);
      return;
    }
    const s = Math.floor(diff / 1000);
    $('cdD').textContent = String(Math.floor(s / 86400)).padStart(2, '0');
    $('cdH').textContent = String(Math.floor(s % 86400 / 3600)).padStart(2, '0');
    $('cdM').textContent = String(Math.floor(s % 3600 / 60)).padStart(2, '0');
    $('cdS').textContent = String(s % 60).padStart(2, '0');
  }
  tick();
  cdTimer = setInterval(tick, 1000);
}

function renderSchedule() {
  const now = new Date();
  const all = (appData.schedule || [])
    .map(m => ({ ...m, _t: parseMatch(m) }))
    .sort((a, b) => a._t - b._t);

  const byRound = {};
  all.forEach(m => { (byRound[m.round] = byRound[m.round] || []).push(m); });

  const rounds = Object.keys(byRound).sort((a, b) => roundNum(a) - roundNum(b));
  if (!rounds.length) {
    $('scheduleBox').innerHTML = '<p class="empty">暂无数据</p>';
    return;
  }

  $('scheduleBox').innerHTML = rounds.map((r, ri) => {
    const list = byRound[r];
    const upcoming = list.filter(m => m._t.getTime() > now.getTime());
    const status = upcoming.length === list.length ? 'wait' : (upcoming.length === 0 ? 'done' : 'live');
    const label = status === 'wait' ? '未开始' : (status === 'done' ? '已结束' : '进行中');
    const open = ri === 0 || status === 'live';
    return `
      <details class="rd" ${open ? 'open' : ''}>
        <summary class="rd-h">
          <span class="rd-nm">${esc(r)}</span>
          <span class="rd-ct">${list.length} 场</span>
          <span class="rd-st ${status}">${label}</span>
        </summary>
        <div class="rd-bd">${list.map(m => matchRow(m, false)).join('')}</div>
      </details>
    `;
  }).join('');
}

function bar(boxId, items, suffix) {
  const box = $(boxId);
  if (!items.length) { box.innerHTML = '<p class="empty">暂无数据</p>'; return; }
  const max = Math.max.apply(null, items.map(i => i.v)) || 1;
  box.innerHTML = items.map(i => `
    <div class="hbc-row">
      <div class="hbc-lb" title="${esc(i.k)}">${esc(i.k)}</div>
      <div class="hbc-tk">
        <div class="hbc-fl" style="background:${i.c};width:0" data-w="${(i.v / max * 100).toFixed(1)}"></div>
      </div>
      <div class="hbc-vl">${esc(i.d)}<i>${esc(suffix || '')}</i></div>
    </div>
  `).join('');
  requestAnimationFrame(() => {
    box.querySelectorAll('.hbc-fl').forEach(f => { f.style.width = f.dataset.w + '%'; });
  });
}

function renderPlayerChart() {
  const items = (appData.players || []).slice(0, 10).map((p, i) => ({
    k: p.name, v: p.pts, d: p.pts, c: i < 3 ? '#00d4ff' : 'rgba(0,212,255,.35)'
  }));
  bar('playerChart', items, '分');
}

function renderTeamChart() {
  const items = allTeams()
    .filter(t => (t.w || 0) + (t.l || 0) > 0)
    .sort((a, b) => winRate(b) - winRate(a) || b.pts - a.pts)
    .slice(0, 12)
    .map(t => ({ k: t.team, v: +winRate(t).toFixed(1), d: +winRate(t).toFixed(1), c: GC[t.group] || '#00d4ff' }));
  bar('teamChart', items, '%');
}

function renderCharts() {
  renderPlayerChart();
  renderTeamChart();
}

$('refreshBtn').onclick = () => load(false);

$('autoBtn').onclick = () => {
  autoOn = !autoOn;
  $('autoBtn').textContent = '自动刷新：' + (autoOn ? '开' : '关');
  if (!autoOn) clearInterval(timer);
  else timer = setInterval(() => load(true), 60000);
};

timer = setInterval(() => { if (autoOn) load(true); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && autoOn) load(true);
});

load(false);
</script>
</body>
</html>
